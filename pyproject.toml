[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian"
version = "0.0.1"
authors = [
  { name="Example Author", email="author@example.com" },
]
description = "Gaussian dispersion with PG stability"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/yosukefk/gaussian"
Issues = "https://github.com/yosukefk/gaussian/issues"
